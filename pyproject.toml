[project]
name = "agenticfoam"
version = "0.1.0"
description = "A stage-gated agentic harness that drives OpenFOAM lid-driven cavity simulations pre- to post-processing."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
agenticfoam = "agenticfoam.demo:main"

[tool.setuptools.packages.find]
include = ["agenticfoam*"]
